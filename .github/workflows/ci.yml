name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Lint (Poncho design tokens)
        # Blocks re-introduction of raw Tailwind palette utilities and any
        # `dark:` prefix. See scripts/check-design-tokens.ts for the rules
        # and the autofix codemods.
        run: pnpm lint:tokens

      - name: Lint (authorization + RLS guards)
        # CRITICAL: these enforce the impersonation-export guard, RLS coverage,
        # and server-action guard discipline. They run in `pnpm verify` (the
        # Definition of Done) but were previously absent from CI — a PR could
        # merge green while introducing an unguarded action or an RLS-less
        # table. Keep CI in parity with `pnpm verify`.
        run: pnpm lint:authz && pnpm lint:rls

      - name: Lint (actions, UI, deps, guardrails)
        run: pnpm lint:ui && pnpm lint:actions && pnpm lint:deps && pnpm lint:lib-root && pnpm lint:mocks && pnpm lint:buttons

      - name: Typecheck (tsc)
        run: pnpm typecheck

      - name: Build (next build)
        run: pnpm build
        env:
          # The build evaluates module-level code that reads these vars (e.g.
          # db/index.ts throws if DATABASE_URL is missing). Real values aren't
          # needed at build time — Next.js marks routes that touch cookies()
          # as dynamic, so DB connections aren't actually made. Dummies are
          # enough to let imports resolve.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key
          SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_key
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres

  dep-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    # Fails on HIGH or CRITICAL advisories. The two known moderate advisories
    # (postcss evasion — build-time only; no runtime exposure) are excluded
    # by --audit-level=high and do NOT fail this job.
    #
    # If a new HIGH advisory appears and you need time to patch:
    #   1. Run `pnpm audit --json` locally to get the advisory ID.
    #   2. Document it in docs/ops/advisory-allowlist.md with a patch deadline.
    #   3. Add `[skip-audit]` to the PR commit message OR apply the
    #      `ci:skip-audit` label to unblock the PR temporarily.
    #   pnpm has no native per-advisory ignore; the documented triage pattern
    #   is: `pnpm audit --json | jq '.advisories | to_entries[] | select(.value.severity == "high" or .value.severity == "critical") | .value'`
    #   Compare the IDs against your allowlist and decide whether to skip.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for skip token
        id: skip-check
        run: |
          SKIP=false
          # Check commit message for [skip-audit] token
          if git log -1 --pretty=%B | grep -qF '[skip-audit]'; then
            SKIP=true
          fi
          # Check PR labels (only available on pull_request events)
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci:skip-audit') }}" == "true" ]]; then
            SKIP=true
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Audit dependencies (HIGH+)
        if: steps.skip-check.outputs.skip != 'true'
        # GHSA-fx2h-pf6j-xcff (vite server.fs.deny bypass on Windows) is dev/test
        # tooling only — vite ships via vitest + @vitejs/plugin-react, is NOT in
        # the prod bundle, and the app never runs the vite dev server. Ignored by
        # GHSA id so any NEW high/critical advisory still fails the gate.
        # Remove once vitest / @vitejs/plugin-react pull vite >=8.0.16.
        run: pnpm audit --audit-level=high --ignore GHSA-fx2h-pf6j-xcff

  migration-presence:
    name: Migration presence check
    runs-on: ubuntu-latest
    # Only meaningful on PRs — push to main/develop is already merged.
    if: github.event_name == 'pull_request'

    # Fails when db/schema.ts is modified in this PR but no new file is added
    # under db/migrations/. This catches the common mistake of editing the
    # schema without running `pnpm db:generate`.
    #
    # ESCAPE HATCH — skip this check when the schema change is comment-only
    # or type-annotation-only (no runtime SQL impact):
    #   • Add the label `ci:no-migration` to the PR, OR
    #   • Include `[no-migration]` anywhere in the PR's HEAD commit message.
    # Document WHY no migration is needed in the PR description so reviewers
    # can verify the claim.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the base ref to diff against
          fetch-depth: 0

      - name: Check for skip token
        id: skip-check
        run: |
          SKIP=false
          if git log -1 --pretty=%B | grep -qF '[no-migration]'; then
            SKIP=true
          fi
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci:no-migration') }}" == "true" ]]; then
            SKIP=true
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Verify migration file present for schema changes
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          BASE=${{ github.base_ref }}
          CHANGED=$(git diff --name-only "origin/${BASE}...HEAD")

          SCHEMA_CHANGED=false
          if echo "$CHANGED" | grep -qF 'db/schema.ts'; then
            SCHEMA_CHANGED=true
          fi

          if [[ "$SCHEMA_CHANGED" == "false" ]]; then
            echo "::notice::db/schema.ts not modified — no migration required."
            exit 0
          fi

          NEW_MIGRATIONS=$(echo "$CHANGED" | grep -E '^db/migrations/[0-9]+.*\.sql$' || true)

          if [[ -z "$NEW_MIGRATIONS" ]]; then
            echo "::error::db/schema.ts was modified but no new migration file found under db/migrations/."
            echo "::error::Run \`pnpm db:generate\` to generate a migration, then commit the resulting .sql file."
            echo "::error::If this change is comment-only or has no SQL impact, add label \`ci:no-migration\` or commit token \`[no-migration]\` and document why."
            exit 1
          fi

          echo "::notice::Schema change accompanied by migration(s):"
          echo "$NEW_MIGRATIONS"

  db-check:
    name: Schema vs migrations drift
    runs-on: ubuntu-latest

    # Catches schema.ts changes that aren't backed by a migration (or vice
    # versa). Spins up a clean Postgres, applies the migrations, and asks
    # drizzle-kit if `db:push` would change anything — if it would, drift exists.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations via drizzle-kit push
        run: pnpm db:push

      - name: Confirm zero pending changes
        # drizzle-kit push is idempotent; a second run should report no work.
        # If it reports pending changes, schema.ts and the migration tree
        # disagree — fix one or the other before merging.
        #
        # Known false-positives — drizzle-kit serializes some defaults in a
        # form PG normalizes differently on introspection, so the diff never
        # converges regardless of schema.ts syntax. These are drizzle-kit
        # bugs, not real drift. Strip the offending statements before asserting.
        #
        #   1. pets.permanent_conditions — empty-array default
        #      (drizzle-orm 0.36 vs PG array default normalization)
        #   2. pet_achievement_views.pulse_until — `now() + interval '7 days'`
        #      (drizzle's sql template emits without parens, PG stores with)
        #   3. organization_coverage unique constraint — drizzle-kit 0.45 introspection
        #      churn: drops and re-adds as UNIQUE NULLS NOT DISTINCT
        #   4. org_invitations_active_unique index — drizzle-kit 0.45 introspection
        #      churn: drops and re-creates expression+partial index
        #   5. organization_invitations.expires_at default — same class as (1)/(2),
        #      interval default serialization churn
        run: |
          OUTPUT=$(pnpm db:push 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qE "(No changes|No schema changes)"; then
            exit 0
          fi
          FILTERED=$(echo "$OUTPUT" \
            | grep -vF 'ALTER TABLE "pets" ALTER COLUMN "permanent_conditions" SET DEFAULT' \
            | grep -vF 'ALTER TABLE "pet_achievement_views" ALTER COLUMN "pulse_until" SET DEFAULT' \
            | grep -vF 'ALTER TABLE "organization_coverage" DROP CONSTRAINT "org_coverage_org_province_locality_unique"' \
            | grep -vF 'ALTER TABLE "organization_coverage" ADD CONSTRAINT "org_coverage_org_province_locality_unique" UNIQUE NULLS NOT DISTINCT' \
            | grep -vF 'DROP INDEX "org_invitations_active_unique"' \
            | grep -vF 'CREATE UNIQUE INDEX "org_invitations_active_unique"' \
            | grep -vF 'ALTER TABLE "organization_invitations" ALTER COLUMN "expires_at" SET DEFAULT')
          if echo "$FILTERED" | grep -qE "^(ALTER TABLE|CREATE|DROP|DO )"; then
            echo "::error::Drizzle reports pending changes — schema.ts ↔ migrations drift"
            exit 1
          fi
          echo "::notice::Only known false-positive drifts detected (permanent_conditions, pulse_until, org_coverage constraint, org_invitations index, expires_at default); treating as no-op."

  test:
    name: Tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Tests need the full Supabase local stack (Postgres + GoTrue + PostgREST),
    # not just bare Postgres — 11 tests call admin.auth.admin.{listUsers,
    # deleteUser,...} and the libreta-share / role-upgrade / dni-verification
    # suites depend on real auth.users rows. supabase CLI brings the stack up
    # via Docker on the same ports as local dev (54321 API, 54322 DB).
    #
    # SUPABASE_SERVICE_ROLE_KEY is the deterministic local-stack secret
    # from `supabase status` — same across local stacks of the same CLI
    # version family. The seed step's auth.admin.createUser calls need a
    # real local key (not a dummy) to land users that the trigger picks up.
    #
    # timeout-minutes raised from 15 → 20 to account for v8 coverage
    # instrumentation overhead (~20-30% on a cold run).
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase local stack
        # studio/inbucket/imgproxy/edge-runtime/realtime are excluded — the
        # test suite doesn't touch any of them, and skipping them shaves
        # several minutes off cold-cache startup. Add a service back to the
        # list if a future test needs it.
        run: pnpm exec supabase start --exclude studio,inbucket,imgproxy,edge-runtime,realtime

      - name: Bootstrap DB (schema + triggers + RLS + seeds)
        # One script replaces what used to be four CI steps: db:push, replay
        # migrations, apply db/*.sql (triggers/RLS/storage), seed reference
        # data + test users. See scripts/db-bootstrap.ts for the contract.
        run: pnpm db:bootstrap

      - name: Run tests with coverage (vitest)
        # Coverage-threshold enforcement (V1-9). The thresholds in
        # vitest.config.ts are RATCHET FLOORS set just under current coverage —
        # they prevent regression below today's level. vitest exits non-zero if
        # any glob drops below its floor. Raise the floors incrementally
        # post-launch as coverage improves.
        run: pnpm test:coverage

      - name: Stop Supabase local stack
        if: always()
        run: pnpm exec supabase stop --no-backup

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The e2e suite runs the built Next.js app against the real Supabase local
    # stack. It needs the same stack the vitest job uses — but the app also
    # needs the real ANON_KEY at runtime (not a dummy), because the browser
    # auth flow calls the GoTrue API directly with it.
    #
    # SUPABASE_SERVICE_ROLE_KEY is the deterministic local-stack secret —
    # same as in the vitest job. NEXT_PUBLIC_SUPABASE_ANON_KEY is extracted
    # from `supabase status` after the stack starts.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Supabase local stack
        # Same exclusions as the vitest job — e2e tests don't need studio,
        # inbucket, imgproxy, edge-runtime, or realtime.
        run: pnpm exec supabase start --exclude studio,inbucket,imgproxy,edge-runtime,realtime

      - name: Bootstrap DB (schema + triggers + RLS + seeds)
        # Bootstraps the full schema, triggers, RLS policies, reference data,
        # and test users (owner@dim.test / Test1234! — see scripts/seed-test-users.ts).
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
        run: pnpm db:bootstrap

      - name: Extract Supabase env vars for runtime
        # `supabase status -o env` emits ANON_KEY/API_URL/etc. Write them to
        # $GITHUB_ENV and also alias ANON_KEY → NEXT_PUBLIC_SUPABASE_ANON_KEY
        # (the CLI uses a raw name; Next.js reads the NEXT_PUBLIC_* form).
        run: |
          # 2>/dev/null drops the pnpm "[WARN] ..." stderr line; grep keeps only
          # KEY=VALUE lines so nothing non-env pollutes $GITHUB_ENV (the warning
          # line previously broke the file command with "Invalid format").
          STATUS_ENV=$(pnpm exec supabase status -o env 2>/dev/null)
          echo "$STATUS_ENV" | grep -E '^[A-Z_][A-Z0-9_]*=' >> "$GITHUB_ENV"
          ANON=$(echo "$STATUS_ENV" | grep '^ANON_KEY=' | cut -d= -f2-)
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON}" >> "$GITHUB_ENV"

      - name: Build Next.js app
        # The build step needs env vars to resolve module-level reads; the
        # ANON_KEY extracted above is now available in the environment.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
        run: pnpm build

      - name: Run Playwright e2e suite
        # NEXT_BUILT=1 tells playwright.config.ts to skip `pnpm build` in the
        # webServer command (build already ran in the previous step).
        # NEXT_PUBLIC_SUPABASE_ANON_KEY is set via ${{ env.* }} from the
        # extract step above; the webServer (`next start`) reads it at runtime.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
          PORT: "3333"
          NEXT_BUILT: "1"
        run: pnpm e2e

      - name: Stop Supabase local stack
        if: always()
        run: pnpm exec supabase stop --no-backup

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
