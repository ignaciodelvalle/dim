name: DB doctor (staging)

# Nightly read-only audit of the STAGING database: migration-ledger honesty,
# real RLS state, effect probes, and function-body parity (db:doctor sections
# A-D — the E-3 "ledger says applied, DB disagrees" tripwire, automated).
#
# Requires the STAGING_DATABASE_URL secret (the Session-pooler connection
# string, docs/ops/staging-deploy.md) — provisioning it is Ignacio-gated. The
# job SKIPS with a notice when the secret is absent, so merging this workflow
# is safe before the secret exists.
#
# Alerting is the `alert` job below, NOT GitHub's failed-workflow email as this
# header used to claim. That email fires on a green -> red transition, and this
# workflow's very first run was already red — so it never transitioned and never
# mailed anyone across 12 consecutive failures.
#
# Cron is UTC: 09:00 UTC = 06:00 in Argentina (UTC-3, no DST) — after the
# nightly QA runs, before the workday.
#
# THE SCHEDULED-FENCE RULE (see scripts/check-scheduled-fence-refs.ts)
# ---------------------------------------------------------------------------
# A `schedule:` event only fires from the DEFAULT branch and checks out the
# DEFAULT branch. This job compares `db/migrations/` ON DISK against the ledger
# in the STAGING database — and staging is deployed from `integration/all-*`, not
# from `main`. Without the explicit `ref:` below, the two sides of the comparison
# came from different trees, which is not a comparison at all.
#
# Measured on run 33109613780 (2026-08-27), the last one before this pin: main's
# tree stops at migration 0170 while staging has 0202 applied, so section A
# reported every migration in between as "in the ledger, NOT on disk" — pure
# phantom drift, an alarm about nothing. Sections B (real RLS state) and C
# (effect probes) ask the database directly and are ref-independent; both passed.
# The only failing section was the only one that reads the checked-out tree. This
# workflow had failed all 12 runs it has ever had, for that reason.
#
# The branch name is a LITERAL on purpose: `${{ vars.X }}` resolves to the empty
# string when unset, and an empty `ref:` silently falls back to the default
# branch — reintroducing exactly this bug with no signal.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Published so the alert job can tell "the audit passed" from "there was no
    # audit". Both look like `success` in `needs.doctor.result`, and one of them
    # is not evidence of anything — see the guard step below.
    outputs:
      audited: ${{ steps.guard.outputs.run }}
    steps:
      - name: Gate on STAGING_DATABASE_URL secret
        id: guard
        # `run` is also this job's `audited` output. When it is false EVERY step
        # below is skipped and the job still reports SUCCESS — GitHub has no
        # "this job did nothing" conclusion for a step-level guard, and it cannot
        # be moved to a job-level `if:` because `secrets` is not in the context
        # available there. So the fact has to be carried out of the job by hand.
        env:
          HAS_SECRET: ${{ secrets.STAGING_DATABASE_URL != '' }}
        run: |
          if [ "$HAS_SECRET" != "true" ]; then
            echo "::notice::STAGING_DATABASE_URL not set — skipping db:doctor. This run audits NOTHING; it is not a passing audit."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          # The branch staging is deployed from — NOT the default branch this
          # schedule fires on. See the header. Kept in sync by
          # `pnpm lint:sched-refs`, which names every file to change when the
          # branch is renamed or merged.
          ref: integration/all-20260703

      - name: Setup pnpm
        if: steps.guard.outputs.run == 'true'
        # No `version:` input on purpose. The version comes from the
        # `packageManager` field in the root package.json, which is the
        # single place this repo pins pnpm — and this action FAILS when
        # both are set and the strings differ ("11" is not "11.1.1").
        # See docs/mobile/eas-build-profiles.md, "One pnpm, everywhere".
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run db:doctor against staging (read-only)
        if: steps.guard.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:doctor -- --allow-remote

  # A guard-skipped audit reports `success`. Until 2026-08-28 that did not just
  # fail to alert — it CLOSED the open alert with "Green again", because the
  # action read `needs.doctor.result == "success"` as recovery. With
  # STAGING_DATABASE_URL absent (its current state) every night was a run that
  # audited nothing and announced the database healthy. The `audited:` input
  # below is the third state: a run that did not audit neither opens nor closes.
  alert:
    name: Alert on a red streak
    needs: doctor
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Local composite actions resolve from the checked-out tree, so this
          # job needs the same pin as the one above.
          ref: integration/all-20260703

      - name: Open or update the alert issue
        uses: ./.github/actions/red-streak-alert
        with:
          workflow: db-doctor-staging.yml
          outcome: ${{ needs.doctor.result }}
          # "" when the doctor job died before its guard step ever ran. That is
          # NOT "true", so a success carrying it would not close the alert —
          # which is the safe direction, and the reason this is compared for
          # equality with "true" rather than inequality with "false".
          audited: ${{ needs.doctor.outputs.audited }}
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "[nightly] DB doctor (staging) is failing"
