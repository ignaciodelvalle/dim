name: Panorama QA nightly (local stack)

# Nightly report-only pass of the three standalone panorama QA harnesses
# (report-panorama-a11y, qa-panorama-vis, qa-panorama-chaos) against the LOCAL
# stack — not staging: the scripts drive chromium.launch() themselves (no
# playwright.config.ts webServer) and need the deterministic seeded accounts +
# panorama data the local bootstrap provides.
#
# REPORT, NOT GATE — by design. The scripts' own headers say nothing here can
# turn a run red (report-panorama-a11y exits 0 with violations on the page);
# the value is the uploaded artifacts a human reviews. Converting any of them
# into a ratcheted gate is a separate, larger decision (needs a violation
# baseline like lint:action-redirect's pattern) — do not do it silently here.
#
# Cron is UTC: 06:30 UTC = 03:30 in Argentina (UTC-3, no DST) — offset from
# e2e-nightly's 06:00 so the two never compete for attention on a red morning.
#
# ONE THING THIS FILE NEEDS THAT IS NOT IN THIS FILE
# ---------------------------------------------------------------------------
# (1) IS DONE — 2026-08-28. This workflow needed to reach `main`, because a
#    `schedule:` trigger is read ONLY from the repository's default branch: a
#    scheduled workflow living on an integration branch has no schedule at all —
#    it is not late, it does not exist. It had run ZERO times for exactly that
#    reason. `main` was then moved to the integration tip (`a3ec504c5`), which is
#    the only thing that could fix it; no `ref:` could. Its first scheduled run
#    is the confirmation, not this comment.
# 2. THE `ref:` BELOW MUST TRACK WHATEVER BRANCH STAGING DEPLOYS FROM, not the
#    default branch by assumption. Every job here builds and serves THE CHECKED-
#    OUT TREE (`pnpm db:bootstrap`, `pnpm build`, `pnpm start`) and then reports
#    on it, so the checkout is the entire subject of the report. Measured
#    2026-08-27, `main` was 3876 commits behind the deployed app; a report about
#    that tree described a product nobody was running. Staging deploys from
#    `main` since 2026-09-01 (`scripts/check-scheduled-fence-refs.ts:76-83`),
#    so `ref: main` below is correct today — the pin stays so the next
#    divergence is a one-line fix here instead of a silent regrade.
#
# The branch name is a LITERAL on purpose: `${{ vars.X }}` resolves to the empty
# string when unset, and an empty `ref:` silently falls back to the default
# branch — reintroducing the bug with no signal.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y-vis:
    name: A11y + visual reports
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The branch staging is deployed from — NOT the default branch this
          # schedule fires on. See the header. Kept in sync by
          # `pnpm lint:sched-refs`, which names every file to change when the
          # branch is renamed or merged.
          ref: main

      - name: Setup pnpm
        # No `version:` input on purpose. The version comes from the
        # `packageManager` field in the root package.json, which is the
        # single place this repo pins pnpm — and this action FAILS when
        # both are set and the strings differ ("11" is not "11.1.1").
        # See docs/mobile/eas-build-profiles.md, "One pnpm, everywhere".
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Supabase local stack
        run: pnpm exec supabase start --exclude studio,inbucket,imgproxy,edge-runtime,realtime

      - name: Extract Supabase env vars for runtime
        uses: ./.github/actions/supabase-env

      - name: Bootstrap DB (schema + triggers + RLS + seeds)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
        run: pnpm db:bootstrap

      - name: Seed panorama data + refresh cube
        # Without this the map is empty and the reports exercise almost no
        # surface. Same reduced SCALE the vitest job uses.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
          SCALE: "0.0004"
        run: pnpm seed:panorama && pnpm cube:refresh

      - name: Build Next.js app
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
        run: pnpm build

      - name: Start server on :3000 and wait
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
          PORT: "3000"
        run: |
          pnpm start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "server never answered on :3000" && exit 1

      - name: A11y report (admin + lucas)
        run: |
          mkdir -p panorama-qa-out
          pnpm qa:panorama-a11y --email=admin@dim.test --out=panorama-qa-out
          pnpm qa:panorama-a11y --email=lucas@dim.test --out=panorama-qa-out

      - name: Visual report (admin + lucas)
        run: |
          pnpm qa:panorama-vis --email=admin@dim.test --out=panorama-qa-out
          pnpm qa:panorama-vis --email=lucas@dim.test --out=panorama-qa-out

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panorama-a11y-vis-reports
          path: panorama-qa-out/
          retention-days: 14

      - name: Stop Supabase local stack
        if: always()
        run: pnpm exec supabase stop --no-backup

  chaos:
    name: Chaos harness
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The branch staging is deployed from — NOT the default branch this
          # schedule fires on. See the header. Kept in sync by
          # `pnpm lint:sched-refs`, which names every file to change when the
          # branch is renamed or merged.
          ref: main

      - name: Setup pnpm
        # No `version:` input on purpose. The version comes from the
        # `packageManager` field in the root package.json, which is the
        # single place this repo pins pnpm — and this action FAILS when
        # both are set and the strings differ ("11" is not "11.1.1").
        # See docs/mobile/eas-build-profiles.md, "One pnpm, everywhere".
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Supabase local stack
        run: pnpm exec supabase start --exclude studio,inbucket,imgproxy,edge-runtime,realtime

      - name: Extract Supabase env vars for runtime
        uses: ./.github/actions/supabase-env

      - name: Bootstrap DB (schema + triggers + RLS + seeds)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
        run: pnpm db:bootstrap

      - name: Seed panorama data + refresh cube
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
          SCALE: "0.0004"
        run: pnpm seed:panorama && pnpm cube:refresh

      - name: Build Next.js app
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
        run: pnpm build

      - name: Start server on :3000 and wait
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
          PORT: "3000"
        run: |
          pnpm start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "server never answered on :3000" && exit 1

      - name: Chaos rounds (seeded, deterministic)
        run: |
          mkdir -p panorama-qa-out
          pnpm qa:panorama-chaos --email=admin@dim.test --seed=1337 --out=panorama-qa-out

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panorama-chaos-reports
          path: panorama-qa-out/
          retention-days: 14

      - name: Stop Supabase local stack
        if: always()
        run: pnpm exec supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # Make a permanently-red fence audible.
  #
  # "REPORT, NOT GATE" (see the header) is about the three QA SCRIPTS: none of
  # them can turn a run red on a finding. It says nothing about the eleven steps
  # around them — `supabase start`, `db:bootstrap`, `seed:panorama`, `pnpm build`,
  # `pnpm start` — every one of which can fail and takes the whole report with
  # it. A report-only job that produces no report is exactly as silent as a gate
  # that never runs.
  #
  # And this workflow had never run once: `gh run list --workflow
  # panorama-qa-nightly.yml` answered `HTTP 404: workflow not found on the
  # default branch` (measured 2026-08-28, hours before `main` was moved to the
  # integration tip). So its first run has NO GREEN TO TRANSITION FROM, and
  # GitHub's transition email — the only alerting this file had — will not fire
  # on it. The streak alert does. That is not a historical note: the very first
  # scheduled run this file ever gets is the one the transition email cannot
  # report, so the alert below is load-bearing precisely now.
  # ---------------------------------------------------------------------------
  alert:
    name: Alert on a red streak
    needs: [a11y-vis, chaos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading the workflow's own run history is what turns one red run into a
      # streak; writing the issue is the alert itself. Both come from the per-run
      # GITHUB_TOKEN — no secret to provision, so nothing to forget.
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Local composite actions resolve from the checked-out tree, so this
          # job needs the same pin as the ones above.
          ref: main

      - name: Fold two job results into one outcome
        id: combined
        # Done in bash rather than a `${{ a && 'x' || b && 'y' || 'z' }}` chain
        # in the `with:` block below. That idiom is unreadable, has no local
        # test, and fails by silently evaluating to the wrong branch — the exact
        # class of quiet wrongness this whole unit is about. Here every branch is
        # explicit and the fall-through emits BOTH results verbatim, which the
        # action reports as "neither pass nor fail" and leaves the alert alone.
        env:
          A11Y: ${{ needs.a11y-vis.result }}
          CHAOS: ${{ needs.chaos.result }}
        run: |
          set -uo pipefail
          if [ "${A11Y}" = "failure" ] || [ "${CHAOS}" = "failure" ]; then
            OUTCOME=failure
          elif [ "${A11Y}" = "success" ] && [ "${CHAOS}" = "success" ]; then
            OUTCOME=success
          else
            OUTCOME="a11y-vis=${A11Y},chaos=${CHAOS}"
          fi
          echo "outcome=${OUTCOME}" >> "$GITHUB_OUTPUT"
          echo "a11y-vis=${A11Y} chaos=${CHAOS} -> ${OUTCOME}"

      - name: Open or update the alert issue
        uses: ./.github/actions/red-streak-alert
        with:
          workflow: panorama-qa-nightly.yml
          outcome: ${{ steps.combined.outputs.outcome }}
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "[nightly] Panorama QA nightly is failing"
