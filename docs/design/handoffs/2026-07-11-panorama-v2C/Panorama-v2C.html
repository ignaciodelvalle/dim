<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
@font-face { font-family: 'Encode Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/fonts/EncodeSans-400.woff2') format('woff2'); }
@font-face { font-family: 'Encode Sans'; font-style: normal; font-weight: 600; font-display: swap; src: url('assets/fonts/EncodeSans-600.woff2') format('woff2'); }
@font-face { font-family: 'Encode Sans'; font-style: normal; font-weight: 700; font-display: swap; src: url('assets/fonts/EncodeSans-700.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/fonts/IBMPlexMono-400.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('assets/fonts/IBMPlexMono-500.woff2') format('woff2'); }
</style>
<title>MiMAR · Panorama v2C — consola fija con overlays</title>
<style>
  :root{
    --navy:#0a3556; --navy-2:#0c2f4a; --azul:#0e5a99; --azul-700:#0a4576; --celeste:#4e97d1;
    --page:#eef1f4; --card:#ffffff; --stripe:#f7f9fb; --line:#dbe1e7; --line-2:#e8ecf0;
    --ink:#16252f; --ink-2:#36454f; --mute:#66727c; --faint:#95a0a8;
    --rail-text:#dce6f1; --rail-mute:#7c93ac;
    --danger:#b71c1c; --warn:#96600e; --ok:#1e7a3e; --blue:#0e5a99;
    --r-sm:4px; --r-md:6px; --r-lg:8px;
    --sans:"Encode Sans",-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:#0a2032;color:var(--ink);font-family:var(--sans);overflow:hidden;font-size:13px;}
  button{font-family:inherit;cursor:pointer;}
  a{color:var(--azul);} a:hover{color:var(--azul-700);}

  /* ===== stage + letterbox (consola fija 1920×1080) ===== */
  #stage-host{position:fixed;inset:0;background:#0a2032;overflow:hidden;}
  #stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;background:var(--page);transform-origin:center center;
    box-shadow:0 24px 70px rgba(0,0,0,.45);overflow:hidden;}
  #vroot{position:absolute;inset:0;}

  /* ===== rail operador (idéntico a Panorama actual) ===== */
  .act-grid{display:flex;height:100%;}
  .nav-rail{width:222px;flex-shrink:0;background:var(--navy);color:var(--rail-text);display:flex;flex-direction:column;padding:16px 12px;}
  .nav-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;}
  .nav-logo{width:30px;height:30px;border-radius:7px;background:var(--azul);display:grid;place-items:center;color:#fff;font-size:14px;flex-shrink:0;}
  .nav-brand-t{font-size:15px;font-weight:700;color:#fff;} .nav-brand-s{font-size:10.5px;color:var(--rail-mute);}
  .nav-scope{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--rail-mute);padding:0 6px 10px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
  .nav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-md);font-size:13px;color:var(--rail-text);}
  .nav-item svg{color:var(--rail-mute);flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--azul);color:#fff;} .nav-item.active svg{color:#fff;}
  .nav-foot{display:flex;align-items:center;gap:10px;padding:12px 6px 2px;border-top:1px solid rgba(255,255,255,.08);}
  .nav-avatar{width:30px;height:30px;border-radius:50%;background:var(--azul-700);display:grid;place-items:center;font-size:11px;color:#fff;font-weight:600;flex-shrink:0;}
  .nav-user{font-size:12.5px;color:#fff;font-weight:500;} .nav-role{font-size:10.5px;color:var(--rail-mute);}

  /* ===== columna principal: nada scrollea, el mapa absorbe el alto ===== */
  .v2-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--page);}

  /* fila 1 · masthead finito */
  .mast{display:flex;align-items:center;gap:14px;background:var(--card);border-bottom:1px solid var(--line);padding:9px 24px;flex:0 0 auto;}
  .mast-crumb{font-size:12px;color:var(--mute);}
  .mast-title{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);}
  .mast-r{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .fresh-chip{border:1px solid var(--line);background:var(--card);padding:3px 10px;border-radius:999px;font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap;}
  .op-btn{border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);color:var(--ink-2);padding:6px 13px;font-size:12.5px;font-weight:500;}
  .op-btn:hover{background:var(--stripe);}
  .op-btn.sm{padding:4px 11px;font-size:12px;}

  /* fila 2 · VISTA (presets actuales) + Capas */
  .vista2{display:flex;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:7px 24px;flex:0 0 auto;}
  .vista2-k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);flex-shrink:0;}
  .vista2-tabs{display:flex;gap:4px;min-width:0;overflow:hidden;}
  .vista2-tab{border:1px solid transparent;background:none;border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;}
  .vista2-tab:hover{background:var(--stripe);border-color:var(--line);}
  .vista2-tab.active{border-color:var(--azul);background:rgba(14,90,153,.09);color:var(--azul);font-weight:600;}
  .capas-btn{margin-left:auto;display:inline-flex;align-items:center;gap:7px;flex-shrink:0;}
  .capas-n{background:var(--azul);color:#fff;border-radius:999px;font-size:10px;padding:1px 7px;font-family:var(--mono);}

  /* fila 3 · una sola línea de controles */
  .ctrl{display:flex;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:8px 24px;flex:0 0 auto;}
  .ctrl-sep{width:1px;height:24px;background:var(--line);flex-shrink:0;}
  .kchips{display:flex;gap:8px;}
  .kchip{display:inline-flex;align-items:baseline;gap:8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:5px 12px;}
  .kchip b{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink);}
  .kchip span{font-size:11px;color:var(--mute);white-space:nowrap;}
  .kchip .kdelta{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--faint);}
  .kchip:hover{border-color:var(--celeste);}
  .kchip.active{border-color:var(--azul);background:rgba(14,90,153,.08);}
  .kchip.active b{color:var(--azul);}
  .scope-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--azul);border-radius:999px;background:rgba(14,90,153,.06);padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--azul);}
  .scope-pill:hover{background:rgba(14,90,153,.12);}
  .scope-pill .scope-pin{font-size:11px;} .scope-pill .caret{font-size:10px;color:var(--azul);}
  .seg-wrap{display:inline-flex;align-items:center;gap:6px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);}
  .seg button{border:none;background:none;padding:5px 13px;font-size:12px;color:var(--ink-2);border-right:1px solid var(--line-2);}
  .seg button:last-child{border-right:none;}
  .seg button:hover{background:var(--stripe);}
  .seg button.active{background:var(--azul);color:#fff;font-weight:600;}
  .seg-more{border:1px dashed #c7cfd6;background:none;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--mute);}
  .seg-more:hover{border-color:var(--azul);color:var(--azul);}
  .seg-more.active{border-style:solid;border-color:var(--azul);color:var(--azul);font-weight:600;background:rgba(14,90,153,.08);}
  .ctrl-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0;}

  /* popovers (alcance / capas / períodos / vistas guardadas) */
  .anchor{position:relative;}
  .pmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:0 18px 50px rgba(20,40,60,.22);padding:6px;min-width:230px;display:flex;flex-direction:column;gap:1px;}
  .ctrl-actions .pmenu,.capas-btn+ .pmenu,.anchor .pmenu.right{left:auto;right:0;}
  .pmenu-scope{max-height:420px;overflow:auto;}
  .pmenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;border-radius:var(--r-md);padding:7px 10px;font-size:12.5px;color:var(--ink);}
  .pmenu button:hover,.pmenu button:focus-visible{background:var(--stripe);outline:none;}
  .pmenu button[aria-checked="true"]{background:rgba(14,90,153,.09);color:var(--azul);font-weight:600;}
  .pmenu-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);padding:7px 10px 3px;}
  .pmenu-row{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12.5px;color:var(--ink-2);}
  .pmenu-note{margin:4px 2px 2px;padding:7px 10px;font-size:11px;color:var(--faint);line-height:1.4;border-top:1px solid var(--line-2);}
  .pmenu-sep{height:1px;background:var(--line-2);margin:4px 6px;}
  .capa-check{width:12px;font-size:11px;color:var(--azul);text-align:center;flex-shrink:0;}
  .capa-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.08);} .capa-dot.sq{border-radius:3px;}
  .capa-count{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);}
  .capa-tag{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--mute);background:var(--stripe);border:1px solid var(--line);border-radius:999px;padding:1px 6px;}

  /* fila 4 · EL MAPA (domina el alto libre) */
  .map-wrap2{flex:1;min-height:0;position:relative;background:var(--card);overflow:hidden;}
  .map-host{position:relative;width:100%;height:100%;overflow:hidden;background:var(--card);}
  .pano-svg{width:100%;height:100%;display:block;}
  .prov{transition:opacity .5s, fill .5s;}
  .prov:hover{stroke:var(--azul);stroke-width:1.6;}
  .g-loc circle{transition:opacity .3s;}
  .map-tip{position:absolute;pointer-events:none;transform:translate(-50%,calc(-100% - 12px));background:rgba(12,47,74,.96);
    color:#fff;border-radius:var(--r-md);padding:6px 9px;font-size:11.5px;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.28);}
  .map-tip b{display:block;font-size:12.5px;margin-bottom:1px;} .map-tip span{color:#bcd3e8;font-family:var(--mono);font-size:10.5px;}
  .back-btn{border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);color:var(--ink-2);padding:6px 12px;font-size:12.5px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .back-btn:hover{background:var(--stripe);}
  .back-btn.map-back{position:absolute;top:14px;left:14px;z-index:12;}
  .zoom-ctrls{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.14);}
  .map-tr{position:absolute;top:14px;right:14px;z-index:12;}
  .zoom-btn{width:32px;height:32px;background:var(--card);border:none;border-bottom:1px solid var(--line);font-size:17px;color:var(--ink-2);display:grid;place-items:center;}
  .zoom-btn:last-child{border-bottom:none;} .zoom-btn:hover{background:var(--stripe);}

  /* leyenda en UNA línea, overlay abajo-izquierda */
  .legend-line{position:absolute;left:14px;bottom:14px;z-index:10;display:flex;align-items:center;gap:12px;white-space:nowrap;
    background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:11.5px;color:var(--ink-2);box-shadow:0 2px 8px rgba(0,0,0,.1);}
  .legend-line b{font-weight:600;color:var(--ink-2);font-size:11.5px;}
  .ramp{display:inline-flex;border-radius:3px;overflow:hidden;border:1px solid var(--line-2);}
  .ramp i{width:14px;height:9px;display:block;}
  .lg-pt{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);}
  .lg-pt i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.1);}
  .kpill{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:10.5px;color:var(--mute);
    background:repeating-linear-gradient(45deg,#f4f6f8 0 3px,#e9edf0 3px 6px);}

  /* fila 5 · dock inferior colapsable */
  .dock2{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;height:356px;transition:height .18s ease;}
  .dock2.collapsed{height:41px;}
  .dock2-bar{height:41px;flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 16px;border-bottom:1px solid var(--line-2);}
  .dock2-grip{color:var(--faint);margin-right:8px;font-size:14px;cursor:ns-resize;}
  .dock2-tab{height:41px;border:none;background:none;padding:0 13px;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;border-bottom:2px solid transparent;}
  .dock2-tab:hover{color:var(--ink);}
  .dock2-tab.active{color:var(--azul);border-bottom-color:var(--azul);font-weight:600;}
  .dock2-tab .cnt{font-family:var(--mono);font-size:10.5px;color:var(--azul);background:rgba(14,90,153,.09);border-radius:999px;padding:1px 7px;}
  .dock2-meta{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .dock2-scope{font-size:11.5px;color:var(--mute);font-family:var(--mono);}
  .dock2-body{flex:1;min-height:0;overflow:auto;padding:12px 20px;}
  .dock2.collapsed .dock2-body{display:none;}
  .dock2-pane{display:none;} .dock2-pane.active{display:block;}
  .dock2-note{margin:10px 2px 0;font-size:11px;color:var(--faint);}

  /* tablas del dock */
  .dt{width:100%;border-collapse:collapse;font-size:12.5px;}
  .dt th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700;padding:7px 10px;border-bottom:1px solid var(--line);position:sticky;top:-12px;background:var(--card);z-index:2;}
  .dt td{padding:8px 10px;border-bottom:1px solid var(--line-2);color:var(--ink);}
  .dt tbody tr:hover{background:var(--stripe);}
  .dt tr.hoverable{cursor:pointer;}
  .dt tr.hoverable:focus-visible{outline:2px solid var(--azul);outline-offset:-2px;}
  .num{font-family:var(--mono);} .rank{color:var(--mute);width:34px;}
  .mute-td{color:var(--mute);}
  .bar-td{width:230px;}
  .bar{height:6px;border-radius:999px;background:var(--line-2);overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--azul);border-radius:999px;}
  .st-pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600;border:1px solid;}
  .st-pill.warn{color:var(--warn);border-color:#e7c98a;background:#fff4da;}
  .st-pill.blue{color:var(--azul);border-color:#cadff0;background:#eef4f9;}
  .st-pill.mute{color:var(--mute);border-color:var(--line);background:var(--stripe);}
  .st-pill.prot{color:var(--mute);border-color:var(--line);background:repeating-linear-gradient(45deg,#f1f3f5 0 4px,#e7ebee 4px 8px);}

  /* scrubber real (mismas clases que Panorama actual) */
  .scrubber{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);padding:11px 14px;display:flex;flex-direction:column;gap:8px;}
  .scrubber.compact{gap:7px;padding:10px 14px;}
  .scr-top{display:flex;justify-content:space-between;align-items:center;}
  .scr-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);}
  .scr-asof{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink);}
  .scr-right{display:flex;align-items:center;gap:10px;}
  .scr-ctr{display:flex;align-items:center;gap:10px;}
  .scr-play{width:28px;height:28px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex-shrink:0;font-size:11px;color:var(--ink-2);}
  .scr-track{flex:1;height:6px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;}
  .scr-fill{position:absolute;top:0;left:0;height:100%;border-radius:999px;background:var(--azul);opacity:.35;}
  .scr-thumb{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--azul);transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(14,90,153,.18);}
  .scr-now{border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);padding:3px 10px;font-size:12px;color:var(--ink-2);}
  .scr-window{position:absolute;top:0;height:100%;background:rgba(14,90,153,.14);border-radius:999px;display:none;}
  .scr-tick{position:absolute;top:-3px;width:1px;height:12px;background:#c7cfd6;transform:translateX(-50%);pointer-events:none;}
  .scr-ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--mute);padding:0 1px;}
  .scr-loops{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .scr-loops-lbl,.scr-basis-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-right:2px;}
  .scr-loop{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--ink-2);}
  .scr-loop:hover{border-color:var(--celeste);}
  .scr-loop.active{border-color:var(--azul);background:rgba(14,90,153,.1);font-weight:600;color:var(--ink);}
  .scr-basis{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .scr-bbtn{border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);color:var(--ink-2);padding:4px 9px;font-size:11.5px;}
  .scr-bbtn.active{border-color:var(--azul);background:rgba(14,90,153,.1);font-weight:600;color:var(--ink);}
  .scr-hint{font-size:11px;color:var(--mute);margin:0;line-height:1.4;}
  .scrubber.unavailable{background:var(--stripe);border-style:dashed;}
  .scr-unavail{display:flex;align-items:flex-start;gap:10px;padding:4px 2px 2px;}
  .scr-unavail-ic{font-size:15px;color:var(--faint);line-height:1.3;flex-shrink:0;}
  .scr-unavail-t{margin:0;font-size:12.5px;font-weight:600;color:var(--ink-2);}
  .scr-unavail-d{margin:2px 0 0;font-size:11px;color:var(--mute);line-height:1.4;}
  .dens-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex-shrink:0;}
  .dens-btn{border:none;background:none;padding:3px 12px;font-size:11px;font-weight:600;color:var(--mute);}
  .dens-btn.active{background:var(--azul);color:#fff;}

  /* toast */
  .toast{position:absolute;left:50%;bottom:60px;transform:translate(-50%,14px);z-index:80;background:rgba(12,47,74,.97);color:#fff;
    border-radius:var(--r-md);padding:9px 16px;font-size:12.5px;box-shadow:0 12px 34px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ===== exploración de posiciones ===== */
  /* B/D · barra única */
  .ctrl.bar1{padding:8px 18px;gap:9px;}
  .vista-drop{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:6px 12px;font-size:12.5px;color:var(--ink);max-width:300px;}
  .vista-drop:hover{border-color:var(--celeste);}
  .vista-drop .vd-k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);}
  .vista-drop .vd-lbl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vista-drop .caret{font-size:10px;color:var(--mute);}
  .bar1 .kchip{padding:4px 10px;} .bar1 .kchip b{font-size:14px;}

  /* C · overlays flotantes: el mapa nunca cambia de tamaño */
  .float-card{position:absolute;z-index:14;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:0 10px 30px rgba(20,40,60,.16);padding:10px;display:flex;flex-direction:column;gap:9px;}
  .cluster-tl{top:14px;left:14px;max-width:330px;}
  .cluster-tr{top:14px;right:14px;align-items:flex-end;}
  .fc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .kchips.vert{flex-direction:column;align-items:stretch;gap:6px;}
  .kchips.vert .kchip{justify-content:space-between;}
  .ctrl-actions.col{margin-left:0;}
  .cluster-tr .pmenu{left:auto;right:0;}
  .lay-C .map-tr{top:auto;bottom:72px;}
  .lay-C .back-btn.map-back{top:14px;left:50%;transform:translateX(-50%);}
  .lay-C .legend-line{bottom:72px;}
  .dock2.float{position:absolute;left:14px;right:14px;bottom:14px;z-index:16;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 16px 44px rgba(20,40,60,.22);overflow:hidden;height:41px;}
  .dock2.float:not(.collapsed){height:42%;}
  .dock2.float .dock2-bar{border-radius:10px 10px 0 0;}

  /* D · dock lateral: el mapa nunca pierde alto */
  .mid{flex:1;min-height:0;display:flex;}
  .mid .map-wrap2{flex:1;min-width:0;}
  .dock2.side{height:auto;width:520px;border-top:none;border-left:1px solid var(--line);transition:width .18s ease;flex:0 0 auto;display:flex;flex-direction:column;}
  .dock2.side.collapsed{width:47px;}
  .dock2.side.collapsed .dock2-bar,.dock2.side.collapsed .dock2-body{display:none;}
  .dock2.side .side-strip{display:none;}
  .dock2.side.collapsed .side-strip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;height:100%;}
  .strip-open{border:1px solid var(--line);background:var(--card);border-radius:var(--r-md);width:30px;height:30px;font-size:13px;color:var(--ink-2);margin-bottom:6px;}
  .strip-open:hover{background:var(--stripe);}
  .strip-tab{border:none;background:none;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink-2);border-radius:var(--r-md);}
  .strip-tab .strip-lbl{writing-mode:vertical-rl;font-size:11.5px;letter-spacing:.02em;}
  .strip-tab .cnt{font-family:var(--mono);font-size:10px;color:var(--azul);background:rgba(14,90,153,.09);border-radius:999px;padding:1px 6px;}
  .strip-tab:hover{background:var(--stripe);}
  .strip-tab.active{color:var(--azul);font-weight:600;background:rgba(14,90,153,.08);}
  .dock2.side .dock2-scope,.dock2.side .dock-csv{display:none;}
  .dock2.side .dock2-body{padding:12px 14px;}
  .dock2.side .dt{font-size:12px;}
  .dock2.side .dt th:nth-child(3),.dock2.side .dt td:nth-child(3){display:none;}
  .dock2.side .bar-td{width:110px;}

</style>
</head>
<body>
  <div id="stage-host">
    <div id="stage"><div id="vroot"></div></div>
  </div>

  

  <script src="geo-data.js"></script>
  <script src="panorama-core.js"></script>
  <script src="panorama-v2-lays.js"></script>
  <script>
    const stage=document.getElementById('stage');
    const host=document.getElementById('stage-host');
    function scaleStage(){ const s=Math.min(host.clientWidth/1920, host.clientHeight/1080); stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
    window.addEventListener('resize',scaleStage);
    scaleStage();

    window.PANO_V2L.mount(document.getElementById('vroot'),'C');
  </script>
</body>
</html>
